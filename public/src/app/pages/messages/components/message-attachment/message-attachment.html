@if (error) {

  <p class="attachment-error">Fichier indisponible.</p>

} @else if (isImage) {

  <button
    type="button"
    class="attachment-image"
    [attr.aria-label]="'Ouvrir ' + attachment.name"
    (click)="open()"
  >
    @if (imageUrl) {
      <img [src]="imageUrl" [alt]="attachment.name" />
    } @else {
      <span class="image-loading">Chargement...</span>
    }
  </button>

} @else {

  <button
    type="button"
    class="attachment-file"
    [class.attachment-file-me]="mine"
    (click)="open()"
  >

    <span class="file-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z" />
        <path d="M14 3v5h5" />
      </svg>
    </span>

    <span class="file-info">
      <strong>{{ attachment.name }}</strong>
      <span>PDF</span>
    </span>

  </button>

}
