@if (error) {

  <p class="attachment-error">Fichier indisponible.</p>

} @else if (isImage) {

  <button
    type="button"
    class="attachment-image"
    [attr.aria-label]="'Agrandir ' + attachment.name"
    (click)="openPreview()"
  >
    @if (imageUrl) {
      <img [src]="imageUrl" [alt]="attachment.name" />
    } @else {
      <span class="image-loading">Chargement...</span>
    }
  </button>

} @else {

  <button
    type="button"
    class="attachment-file"
    [class.attachment-file-me]="mine"
    (click)="openFile()"
  >

    <span class="file-icon">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z" />
        <path d="M14 3v5h5" />
      </svg>
    </span>

    <span class="file-info">
      <strong>{{ attachment.name }}</strong>
      <span>PDF</span>
    </span>

  </button>

}


<!-- PHOTO EN GRAND -->

@if (previewOpen) {

  <div
    class="preview-backdrop"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="attachment.name"
    (click)="closePreview()"
  >

    <button
      type="button"
      class="preview-close"
      aria-label="Fermer"
      (click)="closePreview()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 6l12 12M18 6 6 18" />
      </svg>
    </button>

    <img
      class="preview-image"
      [src]="imageUrl"
      [alt]="attachment.name"
      (click)="$event.stopPropagation()"
    />

  </div>

}
