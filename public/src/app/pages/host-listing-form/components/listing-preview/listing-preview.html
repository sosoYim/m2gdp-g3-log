<section
  class="preview"
  [class.preview-open]="open()"
>


  <!-- EN-TÊTE (bouton « Voir » sur mobile) -->

  <button
    type="button"
    class="preview-toggle"
    [attr.aria-expanded]="open()"
    (click)="open.update(v => !v)"
  >

    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
      <circle cx="12" cy="12" r="3"></circle>
    </svg>

    <span class="preview-title">
      Aperçu de l'annonce
    </span>

    <span class="preview-see">
      {{ open() ? 'Masquer' : 'Voir' }} ›
    </span>

  </button>


  <div class="preview-body">

    @if (form.photos[0]) {

      <img
        class="preview-image"
        [src]="form.photos[0].url"
        alt=""
      />

    } @else {

      <div class="preview-image preview-image-empty">

        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <circle cx="8.5" cy="9.5" r="1.5"></circle>
          <path d="M21 16l-5-5-9 9"></path>
        </svg>

        Vos photos apparaîtront ici

      </div>

    }


    <span class="verified-badge">
      ✓ PROFIL VÉRIFIÉ
    </span>

    <h3>
      {{ form.title || 'Titre de votre annonce' }}
    </h3>

    <p class="area">
      {{ areaLabel }}
    </p>

    <p class="summary">
      {{ summary }}
    </p>

    <p class="price">
      @if (form.price) {
        {{ form.price }} € / mois
      } @else {
        Loyer à définir (étape 4)
      }
    </p>

  </div>

</section>
