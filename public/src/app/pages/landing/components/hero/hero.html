<section
  class="relative min-h-[603px] overflow-hidden bg-[#eeeeff] bg-cover bg-bottom bg-no-repeat"
  style="background-image: url('/images/landing/hero.png')"
>

  <div
    class="relative z-10 mx-auto flex max-w-7xl flex-col items-center px-6 pt-8 text-center lg:pt-10"
  >

    <p
      class="mb-3 text-sm font-medium uppercase tracking-wide text-[#7547f5]"
    >
      Votre prochain chez-vous à Lyon
    </p>


    <h1
      class="text-5xl font-extrabold leading-[0.95] text-[#202aaa] md:text-6xl lg:text-7xl"
    >
      Pars serein,<br />

      <span class="text-[var(--bl-primary)]">
        loue malin
      </span>
    </h1>


    <p
      class="mt-5 text-base text-gray-700 md:text-lg"
    >
      Un logement étudiant pour un stage, un échange ou quelques mois
    </p>


    <!-- Recherche -->

    <div
      class="mt-48 flex w-full max-w-2xl flex-col rounded-xl bg-white shadow-lg md:flex-row"
    >


      <!-- Arrivée -->

      <app-date-field
        class="hero-date flex-1 border-b md:border-b-0 md:border-r"
        label="Arrivée"
        [(value)]="arrivalDate"
      />


      <!-- Départ -->

      <app-date-field
        class="hero-date flex-1 border-b md:border-b-0"
        label="Départ"
        [(value)]="departureDate"
      />


      <!-- Rechercher -->

      <div class="flex items-center p-2">

        <button
          type="button"
          (click)="search()"
          [disabled]="!arrivalDate || !departureDate"
          class="w-full rounded-lg bg-[var(--bl-primary)] px-7 py-3 font-semibold text-white transition hover:bg-[#5f24df] disabled:cursor-not-allowed disabled:opacity-50 md:w-auto"
        >
          Rechercher
        </button>

      </div>

    </div>

  </div>

</section>
