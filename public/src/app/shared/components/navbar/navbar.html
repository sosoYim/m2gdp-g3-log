<header class="w-full bg-white border-b border-gray-100">
  <nav
    class="mx-auto flex max-w-7xl items-center justify-between px-5 py-4 lg:px-8"
  >

    <!-- Logo -->
    <a href="/" class="flex items-center gap-2 font-bold text-[#27219b]">

      <img
        src="/images/landing/features/App.svg"
        alt="Logo BailLyon"
        class="h-8 w-8 object-contain"
      />

      <span>BailLyon</span>

    </a>


    <!-- Navigation desktop -->
    <div class="hidden items-center gap-8 text-sm text-gray-700 md:flex">

      <a href="#accueil" class="font-semibold text-[#7134f5]">
        Accueil
      </a>

      <a
        href="#services"
        class="transition hover:text-[#7134f5]"

        Services
      </a>

      <a

        class="transition hover:text-[#7134f5]"
      >
        À propos
      </a>

    </div>


    <!-- Actions -->
    <div class="flex items-center gap-3">

      <!-- Créer un compte -->
      <button
        type="button"
        class="rounded-lg border border-[#7134f5] px-4 py-2 text-sm font-semibold text-[#7134f5] transition hover:bg-[#f3efff]"
      >
        Créer un compte
      </button>

      <!-- Se connecter -->
      <button
        type="button"
        class="rounded-lg bg-[#7134f5] px-4 py-2 text-sm font-semibold text-white transition hover:bg-[#5f24df]"
      >
        Se connecter
      </button>

    </div>

  </nav>
