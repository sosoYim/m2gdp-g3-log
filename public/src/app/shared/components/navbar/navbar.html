@if (authReady()) {

  @if (isAuthenticated()) {

    <!-- =====================================
         UTILISATEUR CONNECTÉ
    ====================================== -->

    <app-user-navbar />


  } @else {

    <!-- =====================================
         UTILISATEUR NON CONNECTÉ
    ====================================== -->

    <header class="guest-header w-full bg-white border-b border-gray-100">

      <nav
        class="mx-auto flex h-full max-w-7xl items-center justify-between px-5 lg:px-8"
      >

        <!-- Logo -->
        <a href="/" class="brand">

          <img
            src="/icons/logo.svg"
            alt="BailLyon"
            class="brand-logo"
          />

        </a>


        <!-- Navigation desktop -->
        <div
          class="hidden items-center gap-8 text-sm text-gray-700 md:flex"
        >

          <a
            href="#accueil"
            class="font-semibold text-[var(--bl-primary)]"
          >
            Accueil
          </a>

          <a
            href="#services"
            class="transition hover:text-[var(--bl-primary)]"
          >
            Services
          </a>

          <a
            href="#apropos"
            class="transition hover:text-[var(--bl-primary)]"
          >
            À propos
          </a>

        </div>


        <!-- Connexion -->
        <div class="flex items-center">

          <button
            type="button"
            (click)="openAuth()"
            class="rounded-lg bg-[var(--bl-primary)] px-4 py-2 text-sm font-semibold text-white transition hover:bg-[#5f24df]"
          >
            Se connecter ou s'inscrire
          </button>

        </div>

      </nav>

    </header>


    <app-auth-modal
      [isOpen]="authModalOpen()"
      (closed)="closeAuthModal()"
    />

  }

}
