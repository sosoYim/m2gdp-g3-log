<aside class="account-sidebar">

  <p class="sidebar-title">
    MENU DU COMPTE
  </p>


  <nav class="account-menu">


    <!-- Tableau de bord -->

    <button
      type="button"
      class="menu-item"
      [class.menu-item-active]="active === 'dashboard'"
      routerLink="/host/dashboard"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <rect x="3" y="3" width="7" height="7" rx="1"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1"></rect>
      </svg>

      <span>
        Tableau de bord
      </span>

    </button>


    <!-- Mes annonces -->

    <button
      type="button"
      class="menu-item"
      [class.menu-item-active]="active === 'listings'"
      routerLink="/host/listings"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M3 21h18"></path>
        <path d="M5 21V7l7-4 7 4v14"></path>
        <path d="M9 21v-5h6v5"></path>
      </svg>

      <span>
        Mes annonces
      </span>

    </button>


    <!-- Demandes reçues -->

    <button
      type="button"
      class="menu-item"
      [class.menu-item-active]="active === 'requests'"
      routerLink="/host/requests"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path
          d="
            M17 21v-2
            a4 4 0 0 0-4-4
            H5
            a4 4 0 0 0-4 4
            v2
          "
        ></path>

        <circle cx="9" cy="7" r="4"></circle>

        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>

        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
      </svg>

      <span>
        Demandes reçues
      </span>

      @if (pendingCount > 0) {

        <span class="pending-badge">
          {{ pendingCount }}
        </span>

      }

    </button>


    <!-- Messages -->

    <button
      type="button"
      class="menu-item"
      [class.menu-item-active]="active === 'messages'"
      routerLink="/messages"
    >

      <svg
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <path
          d="
            M21 11.5
            a8.38 8.38 0 0 1-.9 3.8
            8.5 8.5 0 0 1-7.6 4.7
            8.38 8.38 0 0 1-3.8-.9
            L3 21
            l1.9-5.7
            A8.38 8.38 0 0 1 4 11.5
            a8.5 8.5 0 0 1 4.7-7.6
            A8.38 8.38 0 0 1 12.5 3
            h.5
            a8.48 8.48 0 0 1 8 8.5Z
          "
        ></path>

      </svg>

      <span>
        Messages
      </span>

    </button>


    <!-- Paramètres -->

    <button
      type="button"
      class="menu-item"
      [class.menu-item-active]="active === 'settings'"
      routerLink="/account-settings"
    >

      <svg
        class="settings-icon"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >

        <circle
          cx="12"
          cy="12"
          r="3"
        ></circle>

        <path
          d="
            M19.4 15
            a1.65 1.65 0 0 0 .33 1.82
            l.06.06
            a2 2 0 1 1-2.83 2.83
            l-.06-.06
            a1.65 1.65 0 0 0-1.82-.33
            1.65 1.65 0 0 0-1 .68
            V20
            a2 2 0 1 1-4 0
            v-.09
            a1.65 1.65 0 0 0-1-.68
            1.65 1.65 0 0 0-1.82.33
            l-.06.06
            a2 2 0 1 1-2.83-2.83
            l.06-.06
            A1.65 1.65 0 0 0 4.6 15
            a1.65 1.65 0 0 0-.68-1
            H4
            a2 2 0 1 1 0-4
            h.09
            a1.65 1.65 0 0 0 .68-1
            1.65 1.65 0 0 0-.33-1.82
            l-.06-.06
            a2 2 0 1 1 2.83-2.83
            l.06.06
            A1.65 1.65 0 0 0 9 4.6
            a1.65 1.65 0 0 0 1-.68
            V4
            a2 2 0 1 1 4 0
            v.09
            a1.65 1.65 0 0 0 1 .68
            1.65 1.65 0 0 0 1.82-.33
            l.06-.06
            a2 2 0 1 1 2.83 2.83
            l-.06.06
            A1.65 1.65 0 0 0 19.4 9
            a1.65 1.65 0 0 0 .68 1
            H20
            a2 2 0 1 1 0 4
            h-.09
            a1.65 1.65 0 0 0-.51 1Z
          "
        ></path>

      </svg>

      <span>
        Paramètres du compte
      </span>

    </button>

  </nav>

</aside>
