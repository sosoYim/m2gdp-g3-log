<div
  class="mobile-menu-overlay"
  (click)="closed.emit()"
>

  <div
    class="mobile-menu"
    (click)="$event.stopPropagation()"
  >


    <!-- =========================
         PROFIL
    ========================== -->

    <div class="menu-profile">

      <div class="menu-avatar">
        {{ initial }}
      </div>


      <div class="menu-profile-info">

        <span class="menu-profile-name">
          {{ fullName || 'Mon compte' }}
        </span>

        <span class="menu-profile-email">
          {{ email }}
        </span>

      </div>

    </div>


    <!-- =========================
         JE VIENS / J'ACCUEILLE
    ========================== -->

    <p class="menu-section-title">
      VOTRE ESPACE
    </p>


    <div
      class="menu-role-switch"
      aria-label="Changer de mode"
    >

      <button
        type="button"
        class="menu-role-button"
        [class.menu-role-active]="role === 'guest'"
        [disabled]="switchingRole"
        (click)="roleChange.emit('guest')"
      >
        Je viens
      </button>


      <button
        type="button"
        class="menu-role-button"
        [class.menu-role-active]="role === 'host'"
        [disabled]="switchingRole"
        (click)="roleChange.emit('host')"
      >
        J’accueille
      </button>

    </div>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <nav class="menu-main-links">

      <a
        routerLink="/"
        (click)="closed.emit()"
      >
        <span>Accueil</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>

      <a
        href="/#services"
        (click)="closed.emit()"
      >
        <span>Services</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>

      <a
        href="/#apropos"
        (click)="closed.emit()"
      >
        <span>À propos</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>

    </nav>


    <!-- =========================
         MON COMPTE
    ========================== -->

    <p class="menu-section-title">
      MON COMPTE
    </p>


    <nav class="menu-account-links">


      @if (role === 'host') {

        <!-- Tableau de bord -->

        <a
          routerLink="/host/dashboard"
          (click)="closed.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="7" height="7" rx="1"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1"></rect>
          </svg>
          <span>Tableau de bord</span>
        </a>


        <!-- Mes annonces -->

        <a
          routerLink="/host/listings"
          (click)="closed.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 21h18"></path>
            <path d="M5 21V7l7-4 7 4v14"></path>
            <path d="M9 21v-5h6v5"></path>
          </svg>
          <span>Mes annonces</span>
        </a>


        <!-- Demandes reçues -->

        <a
          routerLink="/host/requests"
          (click)="closed.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
            <circle cx="9" cy="7" r="4"></circle>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
          </svg>
          <span>Demandes reçues</span>
        </a>

      } @else {

        <!-- Réservations -->

        <a
          routerLink="/renter-account"
          (click)="closed.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <path d="M16 3v4"></path>
            <path d="M8 3v4"></path>
            <path d="M3 10h18"></path>
          </svg>
          <span>Réservations</span>
        </a>


        <!-- Logements enregistrés -->

        <a
          routerLink="/saved-listings"
          (click)="closed.emit()"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8Z"></path>
          </svg>
          <span>Logements enregistrés</span>
        </a>

      }


      <!-- Messages -->

      <a
        routerLink="/messages"
        (click)="closed.emit()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5a8.5 8.5 0 0 1 4.7-7.6A8.38 8.38 0 0 1 12.5 3h.5a8.48 8.48 0 0 1 8 8.5Z"></path>
        </svg>
        <span>Messages</span>
      </a>


      <!-- Paramètres -->

      <a
        routerLink="/account-settings"
        (click)="closed.emit()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 .68V20a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-.68 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-.68-1H4a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 .68-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-.68V4a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 .68 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 .68 1H20a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-.51 1Z"></path>
        </svg>
        <span>Paramètres du compte</span>
      </a>

    </nav>


    <!-- =========================
         DÉCONNEXION
    ========================== -->

    <button
      type="button"
      class="menu-logout-button"
      (click)="logout.emit()"
    >
      Se déconnecter
    </button>

  </div>

</div>
