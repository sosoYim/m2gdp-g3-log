<header class="user-navbar">

  <nav class="navbar-container">

    <!-- Logo -->
    <a routerLink="/" class="brand">

      <img
        src="/images/landing/features/App.svg"
        alt="BailLyon"
        class="brand-logo"
      />

      <span>BailLyon</span>

    </a>


    <!-- Navigation -->
    <div class="navbar-links">

      <a routerLink="/">
        Accueil
      </a>

      <a href="/#services">
        Services
      </a>

      <a href="/#apropos">
        À propos
      </a>

    </div>


    <!-- Utilisateur connecté -->
    <div class="navbar-user">

      <!-- Messages -->
      <button
        type="button"
        class="message-button"
        aria-label="Messages"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path
            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8
               8.5 8.5 0 0 1-7.6 4.7
               8.38 8.38 0 0 1-3.8-.9
               L3 21l1.9-5.7
               A8.38 8.38 0 0 1 4 11.5
               a8.5 8.5 0 0 1 4.7-7.6
               A8.38 8.38 0 0 1 12.5 3h.5
               a8.48 8.48 0 0 1 8 8.5Z"
          />
        </svg>

        <span class="notification-dot"></span>

      </button>


      <!-- Profil -->
      <div
        class="profile-menu-wrapper"
        (click)="$event.stopPropagation()"
      >

        <button
          type="button"
          class="avatar"
          aria-label="Ouvrir le menu utilisateur"
          [attr.aria-expanded]="userMenuOpen()"
          (click)="toggleUserMenu($event)"
        >
          {{ userInitial }}
        </button>


        @if (userMenuOpen()) {

          <div class="profile-menu">

            <div class="profile-menu-header">

              <div class="profile-menu-avatar">
                {{ userInitial }}
              </div>

              <div class="profile-menu-info">

                <span class="profile-menu-title">
                  Mon compte
                </span>

                <span class="profile-menu-email">
                  {{ userEmail }}
                </span>

              </div>

            </div>


            <div class="profile-menu-divider"></div>


            <button
              type="button"
              class="logout-button"
              (click)="logout()"
            >

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path
                  d="M9 21H5a2 2 0 0 1-2-2V5
                     a2 2 0 0 1 2-2h4
                     M16 17l5-5-5-5
                     M21 12H9"
                />
              </svg>

              <span>
                Se déconnecter
              </span>

            </button>

          </div>

        }

      </div>

    </div>

  </nav>

</header>
