<header class="user-navbar">

  <nav class="navbar-container">


    <!-- =========================
         LOGO
    ========================== -->

    <a
      routerLink="/"
      class="brand"
    >

      <img
        src="/icons/logo.svg"
        alt="BailLyon"
        class="brand-logo"
      />

    </a>


    <!-- =========================
         NAVIGATION
    ========================== -->

    <div class="navbar-links">

      <a routerLink="/">
        Accueil
      </a>

      <a href="/#services">
        Services
      </a>

      <a href="/#apropos">
        À propos
      </a>

    </div>


    <!-- =========================
         PARTIE CONNECTÉE
    ========================== -->

    <div class="navbar-user">


      <!-- =========================
           JE VIENS / J'ACCUEILLE
      ========================== -->

      <div
        class="role-switch"
        aria-label="Changer de mode"
      >

        <button
          type="button"
          class="role-button"
          [class.role-active]="currentRole === 'guest'"
          [disabled]="switchingRole()"
          aria-label="Je viens"
          title="Je viens"
          (click)="switchRole('guest')"
        >
          <!-- Mobile : valise (je viens à Lyon) -->
          <svg class="role-icon" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="7" width="16" height="13" rx="2" />
            <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M9 11v5M15 11v5" />
          </svg>
          <span class="role-text">Je viens</span>
        </button>


        <button
          type="button"
          class="role-button"
          [class.role-active]="currentRole === 'host'"
          [disabled]="switchingRole()"
          aria-label="J’accueille"
          title="J’accueille"
          (click)="switchRole('host')"
        >
          <!-- Mobile : maison (j'accueille chez moi) -->
          <svg class="role-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1Z" />
            <path d="M9.5 21v-6h5v6" />
          </svg>
          <span class="role-text">J’accueille</span>
        </button>

      </div>


      <!-- =========================
           MESSAGES
      ========================== -->

      <a
        routerLink="/messages"
        class="message-button"
        [attr.aria-label]="hasUnread ? 'Messages (non lus)' : 'Messages'"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          <path
            d="
              M21 11.5
              a8.38 8.38 0 0 1-.9 3.8
              8.5 8.5 0 0 1-7.6 4.7
              8.38 8.38 0 0 1-3.8-.9
              L3 21
              l1.9-5.7
              A8.38 8.38 0 0 1 4 11.5
              a8.5 8.5 0 0 1 4.7-7.6
              A8.38 8.38 0 0 1 12.5 3
              h.5
              a8.48 8.48 0 0 1 8 8.5Z
            "
          />

        </svg>


        @if (hasUnread) {
          <span
            class="notification-dot"
          ></span>
        }

      </a>


      <!-- =========================
           PROFIL
      ========================== -->

      <div
        class="profile-menu-wrapper"
        (click)="$event.stopPropagation()"
      >


        <button
          type="button"
          class="avatar"
          aria-label="Ouvrir le menu utilisateur"
          [attr.aria-expanded]="userMenuOpen()"
          (click)="toggleUserMenu($event)"
        >

          {{ userInitial }}

        </button>


        @if (userMenuOpen()) {

          <div class="profile-menu">


            <!-- Profil -->

            <div class="profile-menu-header">

              <div class="profile-menu-avatar">
                {{ userInitial }}
              </div>


              <div class="profile-menu-info">

                <span class="profile-menu-title">
                  Mon compte
                </span>

                <span class="profile-menu-email">
                  {{ userEmail }}
                </span>

              </div>

            </div>


            <div
              class="profile-menu-divider"
            ></div>


            <!-- Déconnexion -->

            <button
              type="button"
              class="logout-button"
              (click)="logout()"
            >

              <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
              >

                <path
                  d="
                    M9 21H5
                    a2 2 0 0 1-2-2V5
                    a2 2 0 0 1 2-2h4

                    M16 17l5-5-5-5

                    M21 12H9
                  "
                />

              </svg>


              <span>
                Se déconnecter
              </span>

            </button>

          </div>

        }

      </div>


      <!-- =========================
           MENU MOBILE (BURGER / FERMER)
      ========================== -->

      <button
        type="button"
        class="menu-toggle"
        [class.menu-toggle-open]="mobileMenuOpen()"
        [attr.aria-label]="mobileMenuOpen() ? 'Fermer le menu' : 'Ouvrir le menu'"
        [attr.aria-expanded]="mobileMenuOpen()"
        (click)="toggleMobileMenu()"
      >

        <svg
          viewBox="0 0 24 24"
          aria-hidden="true"
        >

          @if (mobileMenuOpen()) {
            <path d="M6 6l12 12M18 6L6 18"></path>
          } @else {
            <path d="M4 7h16M4 12h16M4 17h16"></path>
          }

        </svg>

      </button>

    </div>

  </nav>

</header>


@if (mobileMenuOpen()) {

  <app-mobile-menu
    [fullName]="userFullName"
    [email]="userEmail"
    [initial]="userInitial"
    [role]="currentRole"
    [switchingRole]="switchingRole()"
    (closed)="closeMobileMenu()"
    (roleChange)="switchRole($event)"
    (logout)="logout()"
  />

}
