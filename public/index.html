<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SubLyon</title>
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>

  <main>
    <h1>SubLyon</h1>
    <p>Sous-location étudiante à Lyon</p>

    <section id="login-section">
      <h2>Se connecter avec votre e-mail</h2>

      <p>
        Pas besoin de mot de passe. Nous vous enverrons
        un lien de connexion par e-mail.
      </p>

      <form id="login-form">
        <label for="email">Adresse e-mail</label>

        <input
          type="email"
          id="email"
          placeholder="etudiant@exemple.com"
          required
        >

        <button type="submit">
          Envoyer le lien magique
        </button>
      </form>

      <p id="message"></p>
    </section>
  </main>

  <script type="module" src="/js/auth.js"></script>
</body>
</html>
